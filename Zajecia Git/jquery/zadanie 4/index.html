<!DOCTYPE html>
<html lang="en">
<head>
    <script src="https://code.jquery.com/jquery-4.0.0.min.js" integrity="sha256-OaVG6prZf4v69dPg6PhVattBXkcOWQB62pdZ3ORyrao=" crossorigin="anonymous"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zadania jquery</title>
    <style>
    </style>
    <script>
        $(function(){
            $("#naKoniec").click(function(){
                let $produkt = $("#produkt").val()
                if($produkt.length > 0){
                    $("#lista").append(`<li>${$produkt}</li>`)
                    $("li").last().css({
                        "color":"teal",
                        "font-weight":"bold"
                    })
                    $("input").val("")
                }
            })
            $("#naPoczatek").click(function(){

                let $produkt = $("#produkt").val()
                if($produkt.length > 0){
                    $("#lista").prepend(`<li>${$produkt}</li>`)
                    $("li").first().css({
                        "color":"pink",
                        "font-weight":"bold"
                    })
                    $("input").val("")
                }
            })

            $("#accept").click(function(){
                if(this.checked){
                    $("#save").removeAttr("disabled")
                }else{
                    $("#save").attr("disabled","disabled")
                }
            })
        })
    </script>
</head>
<body>
    <ul id="lista">
    <li>Chleb</li>
    <li>Mleko</li>
    </ul>
    <input type="text" id="produkt" placeholder="Nazwa produktu">
    <button id="naKoniec">Dodaj na koniec</button>
    <button id="naPoczatek">Dodaj na początek</button>


    <input type="checkbox" id="accept">
    <label for="accept">Czy akceptujesz??</label>
    <button id="save" disabled>Wyślij</button>
</body>
</html>
